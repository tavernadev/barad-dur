<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cards</title>
<style>
  :root { --bg:#fff; --fg:#1f2328; --muted:#59636e; --line:#d1d9e0; --card:#f6f8fa; --accent:#0969da; --bad:#cf222e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0d1117; --fg:#e6edf3; --muted:#9198a1; --line:#3d444d; --card:#151b23; --accent:#4493f8; --bad:#f85149; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; }
  .wrap { max-width:1300px; margin:0 auto; padding:32px 20px 80px; }
  .layout { display:grid; grid-template-columns:minmax(0,1fr) 320px; gap:28px; align-items:start; }
  @media (max-width:760px) { .layout { grid-template-columns:1fr; } }
  h1 { font-size:26px; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 24px; font-size:14px; }
  .head { display:flex; align-items:center; justify-content:space-between; margin-bottom:4px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:16px; }
  .card { display:flex; flex-direction:column; gap:10px; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; transition:border-color .15s, transform .15s; }
  .card:hover { border-color:var(--accent); transform:translateY(-2px); }
  .card .main { display:flex; flex-direction:column; gap:8px; flex:1; color:inherit; text-decoration:none; }
  select, button, input, textarea { font:inherit; color:var(--fg); }
  .card select { font-size:13px; background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:2px 6px; cursor:pointer; }
  select:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible { outline:2px solid var(--accent); }
  /* Status / priority colors: --c is the hue, tinted background keeps it readable in light and dark */
  select[data-field] { --c:#8b949e; background:color-mix(in srgb, var(--c) 16%, var(--bg)); color:color-mix(in srgb, var(--c) 70%, var(--fg)); border-color:color-mix(in srgb, var(--c) 55%, var(--line)); font-weight:600; }
  select[data-value="Pending"]     { --c:#8b949e; }
  select[data-value="Scoping"]     { --c:#a371f7; }
  select[data-value="In Progress"] { --c:#4493f8; }
  select[data-value="Blocked"]     { --c:#db61a2; }
  select[data-value="Code Review"] { --c:#d29922; }
  select[data-value="Testing"]     { --c:#f0883e; }
  select[data-value="Done"]        { --c:#3fb950; }
  select[data-value="Cancelled"]   { --c:#6e7681; }
  select[data-value="Low"]         { --c:#3fb950; }
  select[data-value="Medium"]      { --c:#d29922; }
  select[data-value="High"]        { --c:#f0883e; }
  select[data-value="Urgent"]      { --c:#f85149; }
  .blocked { font-size:12px; line-height:1.4; padding:6px 8px; border-left:3px solid #db61a2; border-radius:4px; background:color-mix(in srgb, #db61a2 14%, transparent); white-space:pre-wrap; }
  .blocked.cancelled { border-left-color:#8b949e; background:color-mix(in srgb, #8b949e 14%, transparent); }
  .id, .num { font-size:12px; font-weight:600; color:var(--accent); letter-spacing:.04em; }
  .tk { font:inherit; font-size:12px; border:1px dashed var(--line); background:none; color:var(--muted); border-radius:999px; padding:1px 9px; cursor:pointer; }
  .tk:hover { border-color:var(--accent); color:var(--accent); }
  .ticket { font-size:12px; font-weight:600; color:var(--accent); border:1px solid var(--accent); border-radius:999px; padding:1px 9px; text-decoration:none; }
  a.ticket:hover { background:color-mix(in srgb, var(--accent) 14%, var(--bg)); }
  .title { font-size:17px; font-weight:600; }
  .row { display:flex; flex-wrap:wrap; gap:6px; align-items:center; font-size:12px; color:var(--muted); }
  .tag { border:1px solid var(--line); border-radius:999px; padding:1px 9px; }
  .empty { color:var(--muted); padding:16px 0; font-size:14px; }

  /* Inbox column */
  aside { position:sticky; top:16px; }
  .add { width:32px; height:32px; border-radius:8px; border:1px solid var(--line); background:var(--card); font-size:20px; line-height:1; cursor:pointer; }
  .add:hover { border-color:var(--accent); color:var(--accent); }
  #form { display:none; flex-direction:column; gap:8px; background:var(--card); border:1px solid var(--accent); border-radius:10px; padding:12px; margin:12px 0; }
  #form.open { display:flex; }
  #form select { width:100%; background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:6px 8px; cursor:pointer; }
  #form .f-row { display:flex; flex-direction:column; gap:4px; }
  #form .f-row > label { font-size:12px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  #form [hidden] { display:none !important; }
  #form input, #form textarea { width:100%; background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:6px 8px; resize:vertical; }
  #form textarea { min-height:90px; }
  #form #f-extra { min-height:64px; }
  #form .f-check { display:flex; align-items:center; gap:8px; font-size:13px; cursor:pointer; }
  #form .f-check input { width:auto; margin:0; }
  #form .actions { display:flex; gap:8px; justify-content:flex-end; }
  #form button { border:1px solid var(--line); background:var(--bg); border-radius:6px; padding:4px 12px; cursor:pointer; }
  #form button.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  #form button:disabled { opacity:.6; cursor:default; }
  .inbox { display:flex; flex-direction:column; gap:10px; margin-top:12px; }
  .item { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px; display:flex; flex-direction:column; gap:6px; transition:border-color .15s; }
  .item:hover { border-color:var(--accent); }
  .item a { color:inherit; text-decoration:none; display:flex; flex-direction:column; gap:4px; }
  .item .t { font-weight:600; }
  .item .d { color:var(--muted); font-size:14px; white-space:pre-wrap; display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden; }
  .item .move { align-self:flex-start; font-size:12px; border:1px solid var(--line); background:var(--bg); border-radius:6px; padding:2px 8px; cursor:pointer; }
  .item .move:hover { border-color:var(--accent); color:var(--accent); }
  .item[draggable="true"] { cursor:grab; }
  .item.dragging { opacity:.5; }
  main { min-height:60vh; border-radius:10px; }
  /* status filters: each chip shows or hides its status; lit = shown */
  .filters { display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
  .chip { --c:#8b949e; font:inherit; font-size:13px; font-weight:600; cursor:pointer; color:var(--muted); background:transparent; border:1px solid var(--line); border-radius:999px; padding:3px 12px; }
  .chip[data-value="Scoping"] { --c:#a371f7; } .chip[data-value="In Progress"] { --c:#4493f8; } .chip[data-value="Done"] { --c:#3fb950; }
  .chip:hover { border-color:color-mix(in srgb, var(--c) 70%, var(--line)); }
  .chip[aria-pressed="true"] { color:color-mix(in srgb, var(--c) 70%, var(--fg)); background:color-mix(in srgb, var(--c) 16%, var(--bg)); border-color:color-mix(in srgb, var(--c) 55%, var(--line)); }
  .chip:focus-visible { outline:2px solid var(--accent); }
  .card.done, .item.done { opacity:.6; }
  main.drop-over { outline:2px dashed var(--accent); outline-offset:6px; background:color-mix(in srgb, var(--accent) 6%, transparent); }
</style>
</head>
<body>
<div class="wrap">
  <div class="layout">
    <main>
      <div class="head">
        <h1>Topics</h1>
        <div class="filters" id="filters" role="group" aria-label="Filter topics by status"></div>
      </div>
      <p class="sub">Cards you are working on and tracking. Each one is a folder under <code>topics/&lt;number&gt;/</code>.</p>
      <div class="grid" id="grid"></div>
    </main>

    <aside>
      <div class="head">
        <h1>Inbox</h1>
        <button class="add" id="add" title="Add to inbox" aria-label="Add to inbox">+</button>
      </div>
      <p class="sub">Cards awaiting a decision to be worked on (<code>inbox/&lt;number&gt;/</code>).</p>
      <form id="form" autocomplete="off">
        <div class="f-row"><label for="f-template">Template</label><select id="f-template" aria-label="Template"><option value="">None</option></select></div>
        <div id="f-blanks"></div>
        <div class="f-row" id="f-extra-row" hidden><label for="f-extra">Extra instructions (optional)</label><textarea id="f-extra" maxlength="1500" placeholder="For the card's Claude session, for example: also look closely at the migrations and say if they are safe to run"></textarea></div>
        <label class="f-check"><input type="checkbox" id="f-topics"> Create in Topics (instead of the Inbox)</label>
        <input id="f-title" name="title" placeholder="Title" maxlength="200" required>
        <textarea id="f-desc" name="description" placeholder="Description"></textarea>
        <div class="actions">
          <button type="button" id="cancel">Cancel</button>
          <button type="submit" class="primary" id="save">Add</button>
        </div>
      </form>
      <div class="inbox" id="inbox"></div>
    </aside>
  </div>
</div>
<script src="/static/dialog.js"></script>
<script src="/static/ticket.js"></script>
<script src="/static/blocked.js"></script>
<script>
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
  const post = (url, body) => fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
    .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); });

  // Workspace number (#1, #2, ...) is ours; the ticket (a link to any tracker, or a key like ABC-123) is optional and can be added later.
  let CFG = {}; // from /api/config (LINEAR_BASE_URL in .env); without it a bare ticket key is shown but not linked
  const loadConfig = () => fetch('/api/config').then((r) => r.json()).then((c) => { CFG = c; }).catch(() => {});
  // The label and link come from static/ticket.js (ClickUp, Linear, Jira, Trello... by the link's address), shared with the card pages.
  const ticketHtml = (c) => {
    const t = c.ticket && window.ticketInfo(c.ticket, CFG.linearBaseUrl);
    if (!t) return '<button class="tk" type="button" data-ticket-edit>+ Ticket</button>';
    return t.href ? `<a class="ticket" href="${esc(t.href)}" target="_blank" rel="noopener" title="${esc(t.title)}">${esc(t.label)}</a>` : `<span class="ticket">${esc(t.label)}</span>`;
  };
  const wireTickets = (root, cards) => root.querySelectorAll('[data-ticket-edit]').forEach((btn) => {
    btn.addEventListener('click', () => {
      const id = btn.closest('[data-id]').dataset.id, card = cards.find((c) => c.id === id);
      baradDialog.prompt({ title: 'Ticket', message: 'Paste a link from ClickUp, Linear, Jira, Trello or any tracker, or a key like ABC-123. Leave it empty to remove the ticket.', value: card.ticket || '', placeholder: 'https://... or ABC-123', confirmText: 'Save', maxLength: 500 }).then((v) => {
        if (v === null) return;
        post('/api/cards/' + encodeURIComponent(id), { ticket: v }).catch(() => baradDialog.notice({ title: 'Not a valid ticket', items: ['Paste a link (ClickUp, Linear, Jira, Trello...) or a key like ABC-123.'] }));
      });
    });
  });
  const byNumber = (a, b) => (a.number || 1e9) - (b.number || 1e9);

  // ---- Inbox form
  const form = document.getElementById('form');
  const open = () => { form.classList.add('open'); document.getElementById('f-title').focus(); };
  const close = () => { form.classList.remove('open'); form.reset(); };
  document.getElementById('add').addEventListener('click', () => (form.classList.contains('open') ? close() : open()));
  document.getElementById('cancel').addEventListener('click', close);
  form.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });
  // Template picker (default: none). A template asks only for its blanks (for Code review, the pull request link); the server fills in the rest.
  const tplSel = document.getElementById('f-template'), blanksEl = document.getElementById('f-blanks');
  const titleEl = document.getElementById('f-title'), descEl = document.getElementById('f-desc');
  const topicsEl = document.getElementById('f-topics');
  let templates = [];
  fetch('/api/templates').then((r) => (r.ok ? r.json() : [])).then((list) => {
    templates = list;
    list.forEach((t) => tplSel.add(new Option(t.name, t.id)));
  }).catch(() => { /* no templates: the picker stays on None */ });
  const applyTemplate = () => {
    const t = templates.find((x) => x.id === tplSel.value);
    titleEl.hidden = descEl.hidden = !!t;
    titleEl.required = !t;
    document.getElementById('f-extra-row').hidden = !t;
    blanksEl.textContent = '';
    if (!t) return;
    t.blanks.forEach((b) => {
      const row = document.createElement('div'); row.className = 'f-row';
      const label = document.createElement('label'); label.textContent = b.label; label.htmlFor = 'f-blank-' + b.key;
      const input = document.createElement('input'); input.id = 'f-blank-' + b.key; input.dataset.key = b.key; input.placeholder = b.hint || ''; input.required = true; input.maxLength = 500;
      row.append(label, input); blanksEl.appendChild(row);
    });
    const first = blanksEl.querySelector('input'); if (first) first.focus();
  };
  tplSel.addEventListener('change', applyTemplate);
  form.addEventListener('reset', () => setTimeout(applyTemplate, 0)); // close() resets the form: back to None
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const save = document.getElementById('save');
    save.disabled = true;
    const body = tplSel.value
      ? { template: tplSel.value, values: Object.fromEntries([...blanksEl.querySelectorAll('input')].map((i) => [i.dataset.key, i.value])), instructions: document.getElementById('f-extra').value, topics: topicsEl.checked }
      : { title: titleEl.value, description: descEl.value, topics: topicsEl.checked };
    post('/api/cards', body)
      .then((card) => { close(); if (card && card.warning) baradDialog.notice({ title: 'Card #' + card.number + ' was created', items: [card.warning, 'The blanks it could not fill in are shown as {{name}} in the card.'] }); }) // the server's file watcher reloads this page, so the new item shows up
      .catch(() => baradDialog.notice(tplSel.value ? { title: 'Could not create the card', items: ['Check the pull request link (https://github.com/<org>/<repo>/pull/<number>).'] } : { title: 'Could not add the card', items: ['Try again.'] }))
      .finally(() => { save.disabled = false; });
  });

  loadConfig().then(() => fetch('/api/cards')).then((r) => r.json()).then((cards) => {
    // Status filters (remembered in the browser), each one independent: a lit chip shows that status, an unlit one hides it.
    // Done and Cancelled are off by default (Done cards are archived in done/ folders). Both apply to both columns; In Progress and
    // Scoping apply to Topics. Other statuses (Pending, Blocked, Code Review, Testing) are always shown.
    const FILTERS = ['Done', 'Cancelled', 'In Progress', 'Scoping'];
    const DEFAULTS = { 'Done': false, 'Cancelled': false, 'In Progress': true, 'Scoping': true };
    let saved = {};
    try { saved = JSON.parse(localStorage.getItem('workspace.statusFilters') || '{}') || {}; } catch { /* use the defaults */ }
    const lit = (st) => (typeof saved[st] === 'boolean' ? saved[st] : DEFAULTS[st]);
    const shows = (c, inTopics) => {
      if (c.done || c.status === 'Done') return lit('Done');
      if (c.status === 'Cancelled') return lit('Cancelled');
      if (inTopics && (c.status === 'In Progress' || c.status === 'Scoping')) return lit(c.status);
      return true;
    };
    const countOf = (st) => cards.filter((c) => (st === 'Done' ? c.done || c.status === 'Done' : st === 'Cancelled' ? c.status === 'Cancelled' : !c.inbox && !c.done && c.status === st)).length;
    const filtersEl = document.getElementById('filters');
    filtersEl.innerHTML = FILTERS.map((st) => `<button class="chip" type="button" data-value="${esc(st)}" aria-pressed="${lit(st)}" title="${lit(st) ? 'Hide' : 'Show'} ${esc(st)} cards">${esc(st)} (${countOf(st)})</button>`).join('');
    filtersEl.querySelectorAll('.chip').forEach((btn) => btn.addEventListener('click', () => {
      const st = btn.dataset.value;
      localStorage.setItem('workspace.statusFilters', JSON.stringify({ ...Object.fromEntries(FILTERS.map((f) => [f, lit(f)])), [st]: !lit(st) }));
      location.reload();
    }));
    const topics = cards.filter((c) => !c.inbox && shows(c, true)).sort(byNumber);
    const inbox = cards.filter((c) => c.inbox && shows(c, false)).sort(byNumber);

    // ---- Inbox list
    const inboxEl = document.getElementById('inbox');
    inboxEl.innerHTML = inbox.length ? inbox.map((c) => `
      <article class="item${c.done ? ' done' : ''}" data-id="${esc(c.id)}">
        <a href="/card/${encodeURIComponent(c.id)}">
          <span class="num">#${esc(c.number ?? '?')}</span>
          <span class="t">${esc(c.title)}</span>
          ${c.description ? `<span class="d">${esc(c.description)}</span>` : ''}
        </a>
        <span class="row"><button class="move" type="button" title="Move to Topics">Move to Topics &rarr;</button>${ticketHtml(c)}</span>
      </article>`).join('') : '<div class="empty">Inbox is empty.</div>';
    inboxEl.querySelectorAll('.item .move').forEach((btn) => {
      btn.addEventListener('click', () => {
        btn.disabled = true;
        post('/api/cards/' + encodeURIComponent(btn.closest('.item').dataset.id), { inbox: false })
          .catch(() => { baradDialog.notice({ title: 'Could not move the card', items: ['Try again.'] }); btn.disabled = false; });
      });
    });

    wireTickets(inboxEl, inbox);

    // ---- Drag an Inbox card onto Topics (the "Move to Topics" button stays as the keyboard fallback)
    const mainEl = document.querySelector('main');
    let draggingId = null;
    inboxEl.querySelectorAll('.item').forEach((el) => {
      el.draggable = true;
      el.querySelectorAll('a').forEach((a) => { a.draggable = false; }); // drag the card, not the link
      el.addEventListener('dragstart', (e) => {
        draggingId = el.dataset.id;
        e.dataTransfer.setData('text/plain', draggingId);
        e.dataTransfer.effectAllowed = 'move';
        el.classList.add('dragging');
      });
      el.addEventListener('dragend', () => { draggingId = null; el.classList.remove('dragging'); mainEl.classList.remove('drop-over'); });
    });
    mainEl.addEventListener('dragover', (e) => {
      if (!draggingId) return; // ignore drags that did not start on an Inbox card
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      mainEl.classList.add('drop-over');
    });
    mainEl.addEventListener('dragleave', (e) => { if (!mainEl.contains(e.relatedTarget)) mainEl.classList.remove('drop-over'); });
    mainEl.addEventListener('drop', (e) => {
      e.preventDefault();
      mainEl.classList.remove('drop-over');
      const id = draggingId;
      if (!id || !inbox.some((c) => c.id === id)) return;
      post('/api/cards/' + encodeURIComponent(id), { inbox: false }) // the file watcher reloads the page, same as the button
        .catch(() => baradDialog.notice({ title: 'Could not move the card', items: ['Try again.'] }));
    });

    // ---- Topics grid (title only)
    const grid = document.getElementById('grid');
    if (!topics.length) {
      const hidden = cards.filter((c) => !c.inbox && !shows(c, true)).length;
      grid.innerHTML = '<div class="empty">' + (hidden ? 'No topics match the filters. ' + hidden + ' ' + (hidden === 1 ? 'is' : 'are') + ' hidden: use the status buttons above.' : 'No topics yet.') + '</div>';
      return;
    }
    grid.innerHTML = topics.map((c) => `
      <article class="card${c.done ? ' done' : ''}" data-id="${esc(c.id)}">
        <a class="main" href="/card/${encodeURIComponent(c.id)}">
          <span class="id">#${esc(c.number ?? '?')}</span>
          <span class="title">${esc(c.title)}</span>
        </a>
        <span class="row">
          <select data-field="status" aria-label="Status"></select>
          <select data-field="priority" aria-label="Priority"></select>
        </span>
        ${c.status === 'Blocked' || c.status === 'Cancelled' ? `<span class="blocked ${c.status === 'Cancelled' ? 'cancelled' : ''}"><b>${esc(c.status)}:</b> ${esc((c.status === 'Blocked' ? c.blockedReason : c.cancelledReason) || 'No reason given.')}</span>` : ''}
        <span class="row">${ticketHtml(c)}</span>
        <span class="row">${(c.tags || []).map((t) => `<span class="tag">${esc(t)}</span>`).join('')}</span>
        ${c.updated ? `<span class="row">Updated ${esc(c.updated)}</span>` : ''}
      </article>`).join('');

    wireTickets(grid, topics);

    fetch('/api/options').then((r) => r.json()).then((options) => {
      grid.querySelectorAll('article.card').forEach((el) => {
        const card = topics.find((c) => c.id === el.dataset.id);
        el.querySelectorAll('select[data-field]').forEach((sel) => {
          const field = sel.dataset.field, values = options[field] || [];
          if (!values.includes(card[field])) { const o = new Option('Not set', '', true, true); o.disabled = true; sel.add(o); }
          values.forEach((v) => sel.add(new Option(v, v)));
          sel.value = values.includes(card[field]) ? card[field] : '';
          sel.dataset.value = sel.value;
          sel.addEventListener('change', () => {
            sel.dataset.value = sel.value;
            sel.disabled = true;
            post('/api/cards/' + encodeURIComponent(card.id), { [field]: sel.value })
              .catch(() => baradDialog.notice({ title: 'Could not save', items: ['The page reloads to show what is stored.'] }).then(() => location.reload()))
              .finally(() => { sel.disabled = false; });
          });
        });
      });
    });
  });
</script>
</body>
</html>
